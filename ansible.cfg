[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
# The community.general.yaml callback was removed in favour of this option
# (ansible-core 2.13+). Using the old name is a hard error on modern Ansible.
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
interpreter_python = /usr/bin/python3
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
