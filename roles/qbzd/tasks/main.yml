---
# Install and service the Qobuz Connect endpoint.
#
# Note what this role deliberately does NOT do: write ~/.config/qbz/qbzd.toml.
# The project does not publish that file's schema, and a config with
# plausible-but-wrong keys fails silently — you would get audio, but
# resampled, with no obvious symptom. Audio configuration is handed to the
# tool's own six-screen wizard instead (`make setup`). See README.

- name: Warn when the release would be fetched unverified
  ansible.builtin.debug:
    msg: >-
      qbzd_sha256 is empty, so the release tarball will be installed without
      integrity verification. See docs/first-boot.md.
  when: qbzd_sha256 | length == 0

# check_mode: false on the read-only probes below — without it the dry run
# skips them, leaving their registered variables undefined and failing the
# tasks that depend on them.
- name: Check the installed version
  ansible.builtin.command: "{{ qbzd_bin }} --version"
  register: qbzd_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report what a real run would install
  ansible.builtin.debug:
    msg: >-
      Would download and install qbzd {{ qbzd_version }} from {{ qbzd_url }}
      (currently: {{ qbzd_installed.stdout | default('not installed') | trim }}).
  when:
    - ansible_check_mode
    - qbzd_version not in (qbzd_installed.stdout | default(''))

# Skipped in check mode: downloading and unpacking cannot be meaningfully
# simulated, and the tasks that follow depend on files this one would create.
- name: Install qbzd from the pinned release
  when:
    - qbzd_version not in (qbzd_installed.stdout | default(''))
    - not ansible_check_mode
  block:
    - name: Create a staging directory
      ansible.builtin.tempfile:
        state: directory
        suffix: qbzd
      register: qbzd_stage

    - name: Download the release tarball
      ansible.builtin.get_url:
        url: "{{ qbzd_url }}"
        dest: "{{ qbzd_stage.path }}/{{ qbzd_tarball }}"
        checksum: "{{ ('sha256:' + qbzd_sha256) if qbzd_sha256 | length > 0 else omit }}"
        mode: "0644"

    - name: Unpack it
      ansible.builtin.unarchive:
        src: "{{ qbzd_stage.path }}/{{ qbzd_tarball }}"
        dest: "{{ qbzd_stage.path }}"
        remote_src: true

    # Locate rather than assume — the archive's internal layout carries a
    # version-stamped directory name.
    - name: Locate the payload inside the archive
      ansible.builtin.find:
        paths: "{{ qbzd_stage.path }}"
        patterns: "qbzd,qbzd.service"
        recurse: true
        file_type: file
      register: qbzd_found

    - name: Fail clearly if the archive layout changed
      ansible.builtin.assert:
        that:
          - qbzd_found.files | selectattr('path', 'search', '/qbzd$') | list | length > 0
          - qbzd_found.files | selectattr('path', 'search', 'qbzd.service$') | list | length > 0
        fail_msg: >-
          {{ qbzd_tarball }} did not contain both 'qbzd' and 'qbzd.service'.
          The release layout may have changed for version {{ qbzd_version }}.

    # /usr/bin, not /usr/local/bin: the shipped unit hardcodes
    # ExecStart=/usr/bin/qbzd run, and upstream documents this path.
    - name: Install the binary
      ansible.builtin.copy:
        src: "{{ (qbzd_found.files | selectattr('path', 'search', '/qbzd$') | list | first).path }}"
        dest: "{{ qbzd_bin }}"
        mode: "0755"
        owner: root
        group: root
        remote_src: true
      notify: Restart qbzd

    - name: Install the shipped systemd user unit
      ansible.builtin.copy:
        src: "{{ (qbzd_found.files | selectattr('path', 'search', 'qbzd.service$') | list | first).path }}"
        dest: /usr/lib/systemd/user/qbzd.service
        mode: "0644"
        owner: root
        group: root
        remote_src: true
      notify: Restart qbzd

    - name: Install bash completions
      ansible.builtin.copy:
        src: "{{ qbzd_stage.path }}/qbzd-{{ qbzd_version }}-linux-aarch64/completions/qbzd.bash"
        dest: /usr/share/bash-completion/completions/qbzd
        mode: "0644"
        remote_src: true
      failed_when: false

  always:
    - name: Clean up staging
      ansible.builtin.file:
        path: "{{ qbzd_stage.path }}"
        state: absent
      when: qbzd_stage.path is defined

# --- Realtime scheduling for the daemon -------------------------------------
# systemd does NOT read /etc/security/limits.conf for services, so the limits
# set in the audio role do not by themselves reach this daemon. Two pieces are
# needed and both matter:
#
#   1. limits.d (audio role) — pam_limits raises the HARD limit when the
#      user@.service session is created.
#   2. this drop-in — raises the SOFT limit for the service itself, which can
#      only go as high as the hard limit above.
#
# Without the drop-in the daemon runs with rtprio 0 and cannot request
# realtime scheduling at all.

- name: Grant the daemon realtime scheduling headroom
  when: enable_rt_limits | bool
  block:
    - name: Create the unit drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/user/qbzd.service.d
        state: directory
        mode: "0755"

    - name: Write the realtime drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/user/qbzd.service.d/10-pistreamer-rt.conf
        mode: "0644"
        content: |
          # Managed by pistreamer.
          # systemd ignores /etc/security/limits.conf for services; these are
          # the equivalents that actually apply to the daemon.
          [Service]
          LimitRTPRIO={{ rt_priority }}
          LimitMEMLOCK=infinity
      notify: Restart qbzd

# --- Service ----------------------------------------------------------------
# qbzd runs as a *user* service. Without lingering, systemd tears down the
# user session — and the daemon with it — the moment the SSH connection
# closes. The streamer would work right up until you disconnected.
# `qbzd status` warns when linger is off.

- name: Enable lingering so the daemon survives logout
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

- name: Resolve the user's uid
  ansible.builtin.command: id -u
  become: false
  register: qbzd_uid
  changed_when: false
  check_mode: false

- name: Enable and start qbzd
  ansible.builtin.systemd:
    name: qbzd
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ qbzd_uid.stdout }}"
  when: not ansible_check_mode

# --- Declarative settings ---------------------------------------------------
# Applied through `qbzd settings set`, the tool's own supported interface,
# rather than by templating ~/.config/qbz/qbzd.toml — whose schema upstream
# does not publish. Read-modify-compare so runs are idempotent.

- name: Read the current qbzd settings
  ansible.builtin.command: "{{ qbzd_bin }} settings show"
  become: false
  register: qbzd_settings_now
  changed_when: false
  failed_when: false
  check_mode: false

- name: Parse the current settings
  ansible.builtin.set_fact:
    qbzd_current: >-
      {{ dict(qbzd_settings_now.stdout_lines | default([])
              | select('search', '=')
              | map('regex_replace', '^\s*(\S+)\s*=\s*(.*?)\s*$', '\1|\2')
              | map('split', '|')) }}

# --- Which DAC? -------------------------------------------------------------
# /proc/asound/cards looks like:
#    0 [M2496          ]: USB-Audio - Musical Fidelity V90-DAC 24/96
# so the bracketed field is the ALSA card name that "hw:CARD=" wants.
#
# A DAC that is switched off de-enumerates from USB and vanishes from this
# file. That is normal, not a fault — so detection failing must NOT abort the
# run. When nothing is detected we keep whatever device is already configured,
# and only fail when there is no usable value to fall back to.

- name: Read the sound cards
  ansible.builtin.command: cat /proc/asound/cards
  register: qbzd_cards
  changed_when: false
  check_mode: false

- name: Discover the USB DAC's ALSA card name
  ansible.builtin.set_fact:
    qbzd_detected_card: >-
      {{ (qbzd_cards.stdout_lines | select('search', 'USB-Audio')
          | map('regex_replace', '^\s*\d+\s*\[\s*(\S+)\s*\].*$', '\1')
          | list | first | default('')) | trim }}
  when: qbzd_audio_device == 'auto'

- name: Resolve the output device
  ansible.builtin.set_fact:
    qbzd_device_resolved: >-
      {{ qbzd_audio_device if qbzd_audio_device != 'auto'
         else ('hw:CARD=' ~ qbzd_detected_card ~ ',DEV=0')
              if (qbzd_detected_card | default('') | length > 0)
         else (qbzd_current['audio.device'] | default('')) }}

- name: Report that the configured DAC is being kept
  ansible.builtin.debug:
    msg: >-
      No USB audio card is present — the DAC is probably switched off or
      unplugged. Keeping the configured device '{{ qbzd_device_resolved }}'.
  when:
    - qbzd_audio_device == 'auto'
    - qbzd_detected_card | default('') | length == 0
    - qbzd_device_resolved | length > 0

- name: Fail only when there is no device to fall back to
  ansible.builtin.assert:
    that:
      - qbzd_device_resolved | length > 0
      - qbzd_device_resolved != 'system'
    fail_msg: >-
      No USB audio card was found in /proc/asound/cards and no usable device is
      configured yet, so there is nothing to fall back to. Switch the DAC on and
      re-run, or pin qbzd_audio_device explicitly in group_vars/all.yml.
      ('system' is rejected on purpose: it routes through ALSA's default device
      and silently disables bit-perfect output.) Check with `make dacs`.
    success_msg: "Output device: {{ qbzd_device_resolved }}"

- name: Fold the device into the settings
  ansible.builtin.set_fact:
    qbzd_settings_effective: "{{ qbzd_settings | combine({'audio.device': qbzd_device_resolved}) }}"

# --- Seed once, then leave the web UI alone ---------------------------------
# These settings are editable from the web UI. Re-imposing them on every run
# would silently undo whatever you changed there — you would toggle gapless,
# run `make provision` for an unrelated reason, and find it reverted with no
# indication why.
#
# So each key is applied ONCE and then recorded. `qbzd settings show` cannot
# help here: it always returns a value, so "the user chose false" and "false is
# the default" are indistinguishable. Hence an explicit ledger of what this
# role has already seeded.
#
# Escape hatch: `make settings-force` re-imposes every value from group_vars.

- name: Ensure the state directory exists
  ansible.builtin.file:
    path: "{{ qbzd_seed_file | dirname }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Read which settings have already been seeded
  ansible.builtin.slurp:
    src: "{{ qbzd_seed_file }}"
  register: qbzd_seed_raw
  failed_when: false
  check_mode: false

- name: Parse the ledger
  ansible.builtin.set_fact:
    qbzd_seeded: >-
      {{ (qbzd_seed_raw.content | b64decode | from_json)
         if (qbzd_seed_raw.content is defined and qbzd_seed_raw.content | length > 0)
         else [] }}

- name: Decide which settings to apply
  ansible.builtin.set_fact:
    # audio.device is always enforced: it is derived from the hardware actually
    # present, not a preference. Seeding it would break DAC auto-detection —
    # swap converters and the old device would stay configured forever.
    qbzd_to_apply: >-
      {{ qbzd_settings_effective if qbzd_force_settings | bool else
         (qbzd_settings_effective | dict2items
          | selectattr('key', 'in', qbzd_always_enforce + (
              qbzd_settings_effective.keys() | difference(qbzd_seeded) | list))
          | list | items2dict) }}

- name: Report settings left under UI control
  ansible.builtin.debug:
    msg: >-
      Leaving {{ (qbzd_settings_effective.keys() | list | length)
                 - (qbzd_to_apply.keys() | list | length) }} already-seeded
      setting(s) as configured on the device. Use `make settings-force` to
      re-impose group_vars.
  when:
    - not qbzd_force_settings | bool
    - (qbzd_to_apply.keys() | list | length) < (qbzd_settings_effective.keys() | list | length)

- name: Apply qbzd settings
  ansible.builtin.command:
    argv:
      - "{{ qbzd_bin }}"
      - settings
      - set
      - "{{ item.key }}"
      - "{{ item.value }}"
  become: false
  loop: "{{ qbzd_to_apply | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  when:
    - qbzd_settings_now.rc | default(1) == 0
    - qbzd_current[item.key] | default('__unset__') != (item.value | string)
  notify: Restart qbzd

- name: Record what has been seeded
  ansible.builtin.copy:
    content: "{{ (qbzd_seeded + (qbzd_settings_effective.keys() | list)) | unique | sort | to_nice_json }}"
    dest: "{{ qbzd_seed_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: qbzd_settings_now.rc | default(1) == 0

- name: Note when settings could not be applied
  ansible.builtin.debug:
    msg: >-
      Could not read qbzd settings — the daemon may not be running yet.
      Settings will be applied on the next `make provision`.
  when: qbzd_settings_now.rc | default(1) != 0

# --- Close the daemon to the LAN --------------------------------------------
# qbzd binds 0.0.0.0:8182 by default, so anyone on the network can control
# playback. Its token auth is not usable here: the CLI has no --token flag and
# honours no token environment variable (verified — its only options are
# --host, -q, -h, -V), so enabling one would break `qbzd settings set`,
# `qbzd login` and this project's own provisioning.
#
# Binding to localhost achieves the same goal without that cost. The CLI and
# the web UI both run on the Pi, so neither notices; the LAN loses its
# unauthenticated back door, and the web UI becomes the single front door.

# The config directory is ~/.config/qbzd/ — NOT ~/.config/qbz/, which the
# upstream wiki states. Writing to the documented path silently does nothing:
# the daemon never reads it. `qbzd config path` is the authority, so ask it
# rather than hardcoding either spelling.
- name: Ask qbzd where its config lives
  ansible.builtin.command: "{{ qbzd_bin }} config path"
  become: false
  register: qbzd_paths
  changed_when: false
  check_mode: false
  when: qbzd_bind_localhost | bool

- name: Resolve the config file path
  ansible.builtin.set_fact:
    qbzd_toml: >-
      {{ (qbzd_paths.stdout_lines | select('search', '^\s*config\s*:')
          | map('regex_replace', '^\s*config\s*:\s*', '') | list | first
          | default(ansible_env.HOME ~ '/.config/qbzd')) | trim }}/qbzd.toml
  when: qbzd_bind_localhost | bool

- name: Check whether the config file exists
  ansible.builtin.stat:
    path: "{{ qbzd_toml }}"
  become: false
  register: qbzd_toml_stat
  when: qbzd_bind_localhost | bool

# Two paths, because the shipped file already contains a [server] section.
# Appending another would duplicate the table — invalid TOML — so an existing
# file gets its bind line edited in place instead.
- name: Create the config file with a server section
  ansible.builtin.copy:
    dest: "{{ qbzd_toml }}"
    mode: "0644"
    content: |
      # Managed by pistreamer.
      [server]
      bind = "127.0.0.1"
      port = 8182
  become: false
  when:
    - qbzd_bind_localhost | bool
    - not qbzd_toml_stat.stat.exists
  notify: Restart qbzd

- name: Bind the daemon to localhost only
  ansible.builtin.lineinfile:
    path: "{{ qbzd_toml }}"
    regexp: '^\s*bind\s*='
    line: 'bind = "127.0.0.1"'
    insertafter: '^\s*\[server\]'
  become: false
  when:
    - qbzd_bind_localhost | bool
    - qbzd_toml_stat.stat.exists
  notify: Restart qbzd

# Cleans up a file an earlier version of this role wrote to the path the
# upstream wiki documents (~/.config/qbz/), which the daemon never reads.
#
# NOT ansible_env.HOME: facts are gathered with become active, so that resolves
# to /root and the deletion silently targets a path that never existed.
- name: Remove the file written to the wrong path
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/qbz/qbzd.toml"
    state: absent

- name: Remove the stray config directory if now empty
  ansible.builtin.command: "rmdir /home/{{ ansible_user }}/.config/qbz"
  register: qbzd_rmdir
  changed_when: qbzd_rmdir.rc == 0
  failed_when: false

- name: Report how to finish setup
  ansible.builtin.debug:
    msg:
      - "qbzd {{ qbzd_version }} installed and running."
      - "Finish interactively:  make dacs   then   make setup"
      - "`qbzd setup` is a six-screen wizard: Qobuz login, audio device, Connect name."
      - "Then pick '{{ streamer_hostname }}' from the Connect menu in any Qobuz app."
