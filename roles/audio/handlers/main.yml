---
- name: Flag reboot required
  ansible.builtin.set_fact:
    reboot_required: true

- name: Restart CPU governor unit
  ansible.builtin.systemd:
    name: pistreamer-governor
    state: restarted
    enabled: true
    daemon_reload: true
  failed_when: false

- name: Restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
  failed_when: false
