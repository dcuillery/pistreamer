---
# OS hygiene: name it, keep it reachable, and stop it chewing through the SD card.

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ streamer_hostname }}"

# /etc/hosts is deliberately left alone: cloud-init manages it on Pi OS and
# rewrites the 127.0.1.1 entry, so editing it here would report "changed" on
# every run and get reverted anyway. Pi OS already resolves the hostname.

# Done with timedatectl rather than community.general.timezone so the repo
# needs no collections beyond ansible-core.
# check_mode: false — this only reads, and without it the dry run skips the
# task, leaving current_tz undefined and breaking everything downstream.
- name: Read the current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_tz
  changed_when: false
  check_mode: false

- name: Set timezone
  ansible.builtin.command: "timedatectl set-timezone {{ streamer_timezone }}"
  when: current_tz.stdout != streamer_timezone
  changed_when: true

- name: Install the packages a streamer needs
  ansible.builtin.apt:
    name:
      - alsa-utils        # aplay/amixer — how we enumerate the DAC
      - avahi-daemon      # mDNS, so streamer.local resolves
      - iw                # to verify Wi-Fi power saving is actually off
      - ca-certificates
      - curl
    state: present

- name: Remove packages that only add jitter and attack surface
  ansible.builtin.apt:
    name:
      - triggerhappy
      - modemmanager
    state: absent
    purge: true

- name: Ensure mDNS is running so streamer.local resolves
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started

# Swapping to an SD card stalls audio and wears the card. With one small
# daemon on 1 GB there is nothing to gain from keeping it.
- name: Disable swap
  when: disable_swap | bool
  block:
    - name: Stop dphys-swapfile
      ansible.builtin.systemd:
        name: dphys-swapfile
        enabled: false
        state: stopped
      failed_when: false

    - name: Tear down the swapfile
      ansible.builtin.command: dphys-swapfile swapoff
      register: swapoff
      changed_when: "'swapoff' in swapoff.stdout | default('')"
      failed_when: false

# Pi OS keeps the journal in /run by default, so it is wiped on every restart
# and `journalctl -b -1` shows nothing. On an appliance that drops off the
# network or loses power, the previous boot's log is precisely the evidence you
# need — a diagnosis tool that forgets across a reboot is no diagnosis tool.
# SystemMaxUse below bounds the SD-card cost.
- name: Make the journal survive reboots
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  when: journald_persistent | bool
  notify: Restart journald

- name: Configure journald storage and size cap
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "Storage", value: "{{ 'persistent' if journald_persistent | bool else 'volatile' }}" }
    - { key: "SystemMaxUse", value: "{{ journald_max_use }}" }
  notify: Restart journald
